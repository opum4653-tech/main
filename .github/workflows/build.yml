name: Build Driver Loader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Clean Local Properties & Accept Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          export GRADLE_OPTS="-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
          if command -v gradle >/dev/null 2>&1; then
            echo "Using pre-installed Gradle from PATH..."
            gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          else
            ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          fi

      - name: Check Build Status
        run: |
          if ! ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi
          echo "SUCCESS: Found APK:"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriverLoader-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Resolve Release Tag
        id: release_tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
            echo "tag=v${VER}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release_tag.outputs.tag }}
          name: "NINMODS Official Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## NINMODS Official Release
            - **APatch Official UI & System Standard**:
              - 1:1 APatch Official `SwitchItem` component with `toggleable` and `interactionSource` (zero custom code).
              - Modern rounded navigation bar with `28.dp` top corners.
              - Reusable `AppSelectionBottomSheet` in `ui/dialogs/` used across Driver Loader and Settings reboot menu.
              - Complete removal of artificial placeholders/emails; only authentic session identity is shown.
            - **100% Real APatch System Integration**:
              - Live POSIX kernel detection (`Os.uname().release`).
              - Real root shell executor (`su` fallback to `/data/adb/ap/bin/su`, `/system/bin/su`, `/data/adb/magisk/su`).
              - Character device node detector inspecting active kernel driver nodes (`/dev/BYNb`, `/dev/mem_tool`, `/dev/nh`, `/dev/wanbai`).
            - **Interactive Status Cards & Digital Clock**:
              - Live license countdown clock (`HH:MM:SS`).
              - SuperUser and Driver status cards.
            - **Production Signed Release**:
              - Dedicated keystore `ninmods-release.jks` with R8 optimization.
          artifacts: "app/build/outputs/apk/release/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
