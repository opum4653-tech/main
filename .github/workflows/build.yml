name: Build Driver Loader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.2
        run: |
          mkdir -p /tmp/gradle_dist
          echo "Downloading Gradle 8.2 distribution from mirror..."
          curl -L --retry 5 --retry-delay 2 "https://mirrors.cloud.tencent.com/gradle/gradle-8.2-bin.zip" -o /tmp/gradle_dist/gradle-8.2-bin.zip
          unzip -q /tmp/gradle_dist/gradle-8.2-bin.zip -d /tmp/gradle_dist/
          echo "Gradle 8.2 unpacked successfully:"
          /tmp/gradle_dist/gradle-8.2/bin/gradle -v

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Clean Local Properties & Accept Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          /tmp/gradle_dist/gradle-8.2/bin/gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Check Build Status
        run: |
          if ! ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi
          echo "SUCCESS: Found APK:"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriverLoader-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Resolve Release Tag
        id: release_tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VER=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
            echo "tag=v${VER}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release_tag.outputs.tag }}
          name: "NINMODS Official Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## NINMODS Official Release
            - **Full-Cycle In-App Financial Architecture**:
              - **Real User Wallet Balance**: Live synchronization with backend server across dashboard, navigation drawer, and profile.
              - **Direct In-App Deposit Flow**: UserDepositBottomSheet supports active payment gateways, auto-copies transfer details, and submits TrxID.
              - **Self-Service VIP License Purchasing**: PurchaseKeyBottomSheet enables instant plan purchasing directly using wallet balance.
            - **License Inventory & Device Management**:
              - User Profile directly displays all owned license keys with validity period and status pills.
              - 1-tap Reset HWID button to instantly unbind devices without admin intervention.
              - Complete Transaction Ledger displaying real-time deposit and purchase logs.
            - **Navigation & UX Modernization**:
              - Default launch & login view set directly to Dashboard.
              - Back navigation seamlessly retains users in the application.
              - Drawer includes direct Add Funds deposit trigger and user balance pill.
            - **APatch System Standard & Production Signing**:
              - Real POSIX kernel detection, root shell executor, and active character device node scanning.
              - Signed release APK built with dedicated keystore.
          artifacts: "app/build/outputs/apk/release/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
