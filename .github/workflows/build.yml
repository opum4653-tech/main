name: Build NinMods APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local.properties
        run: |
          rm -f local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        id: apk
        if: always()
        run: |
          set -e
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out || true
          COUNT=$(ls out/*.apk 2>/dev/null | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No APK was produced by either variant"
            exit 1
          fi

      - name: Resolve version
        id: ver
        if: always()
        run: |
          NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed 's/[^0-9]//g')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: always() && steps.apk.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: NinMods-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: out/*.apk
          retention-days: 30

      - name: Resolve release tag
        id: tag
        if: always()
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.ver.outputs.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
          name: NinMods ${{ steps.tag.outputs.tag }}
          body: |
            NinMods ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})

            - Java/Kotlin View-system rebuild: every screen is an XML layout hosted by a real Android component.
            - Driver loader, overlay engine, denylist cloak and identity spoofer unchanged.
            - Compose removed from the dependency graph.
          artifacts: out/*.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
